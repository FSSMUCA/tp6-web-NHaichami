<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Mini Calculatrice</h1>
</header>

<main>

    <section class="card">
        <h2>Faire un calcul</h2>

        <form id="calcForm">

            <div class="input-group">
                <label>Nombre A</label>
                <input type="number" id="a">
            </div>

            <div class="input-group">
                <label>Nombre B</label>
                <input type="number" id="b">
            </div>

            <div class="input-group">
                <label>Opération</label>
                <select id="op">
                    <option value="+">Addition (+)</option>
                    <option value="-">Soustraction (−)</option>
                    <option value="*">Multiplication (×)</option>
                    <option value="/">Division (÷)</option>
                </select>
            </div>

            <button type="submit" class="btn">Calculer</button>
        </form>

        <p id="error" class="error"></p>
        <p id="result" class="result"></p>
    </section>

    <section class="card">
        <h2>Historique</h2>
        <ul id="historyList" class="history"></ul>
    </section>

</main>

<footer>
    <p>TP 6 — Mini Projet Web</p>
</footer>

<script src="app.js"></script>

</body>
</html>
